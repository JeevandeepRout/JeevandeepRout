<svg xmlns="http://www.w3.org/2000/svg" width="620" height="148" viewBox="0 0 620 148"
     fill="none" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" role="img" aria-label="contribution activity for JeevandeepRout">
  <style>
    .dim    { fill: #6e7681; }
    .mid    { fill: #8c959f; }
    .strong { fill: #1f2328; }
    .line   { stroke: #1f2328; }
    .wash   { fill: #6e7681; opacity: 0.13; }
    .sweep  { fill: #1f2328; }
