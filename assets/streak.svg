<svg xmlns="http://www.w3.org/2000/svg" width="620" height="96" viewBox="0 0 620 96" fill="none"
     font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" role="img" aria-label="contribution streaks for JeevandeepRout">
  <style>
    .num  { fill: #424a53; }
    .muted{ fill: #8c959f; }
    .rule { stroke: #d8dee4; }
    @media (prefers-color-scheme: dark) {
      .num  { fill: #f0f6fc; }
      .muted{ fill: #8b949e; }
      .rule { stroke: #30363d; }
    }
  </style>

  <line x1="310" y1="16" x2="310" y2="80" class="rule" stroke-width="1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.20s" dur="0.45s" fill="freeze"/>
  </line>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.12s" dur="0.45s" fill="freeze"/>
    <text x="34" y="44" class="num" font-size="34" font-weight="600">2</text>
    <text x="34" y="64" class="muted" font-size="11">current streak</text>
    <text x="34" y="80" class="muted" font-size="10">aug 8 – aug 9</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.26s" dur="0.45s" fill="freeze"/>
    <text x="344" y="44" class="num" font-size="34" font-weight="600">3</text>
    <text x="344" y="64" class="muted" font-size="11">longest streak</text>
    <text x="344" y="80" class="muted" font-size="10">aug 2 – aug 4</text>
  </g>
</svg>