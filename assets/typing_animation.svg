<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 380 50"
     width="380" height="50"
     role="img"
     aria-label="Animated typing text">
  <title>Animated typing text</title>
  <metadata>
    <duration>4000ms per line</duration>
    <pause>1000ms after line, before retract</pause>
  </metadata>
  <desc>Each line displays for 4000 milliseconds, remains visible for a 1000 millisecond pause, then retracts smoothly before the next line begins.</desc>

  <style>
    .typing-text { fill: #424a53; }
    @media (prefers-color-scheme: dark ) {
      .typing-text { fill: #f0f6fc; }
    }
  </style>

  <!-- Reveal 4000 ms, hold visibly for 1000 ms, retract smoothly for 1000 ms -->
  <path id="path0">
    <animate id="d0" attributeName="d" begin="0s;d2.end"
      dur="6000ms" fill="remove"
      values="m0,25 h0; m0,25 h380; m0,25 h380; m0,25 h0"
      keyTimes="0;0.6666667;0.8333333;1" />
  </path>
  <text class="typing-text" font-family="monospace" font-size="20"
        dominant-baseline="middle" x="50%" text-anchor="middle">
    <textPath xlink:href="#path0">Hi There! 👋 I'm Jeevandeep Rout</textPath>
  </text>

  <path id="path1">
    <animate id="d1" attributeName="d" begin="d0.end"
      dur="6000ms" fill="remove"
      values="m0,25 h0; m0,25 h380; m0,25 h380; m0,25 h0"
      keyTimes="0;0.6666667;0.8333333;1" />
  </path>
  <text class="typing-text" font-family="monospace" font-size="20"
        dominant-baseline="middle" x="50%" text-anchor="middle">
    <textPath xlink:href="#path1">🧭 Exploring Software Development</textPath>
  </text>

  <path id="path2">
    <animate id="d2" attributeName="d" begin="d1.end"
      dur="6000ms" fill="remove"
      values="m0,25 h0; m0,25 h380; m0,25 h380; m0,25 h0"
      keyTimes="0;0.6666667;0.8333333;1" />
  </path>
  <text class="typing-text" font-family="monospace" font-size="20"
        dominant-baseline="middle" x="50%" text-anchor="middle">
    <textPath xlink:href="#path2">🛠️ Building Open Source Projects</textPath>
  </text>
</svg>
