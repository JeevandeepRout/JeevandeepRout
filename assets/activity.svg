      .dim    { fill: #c9d1d9; }
      .mid    { fill: #8b949e; }
      .strong { fill: #f0f6fc; }
      .line   { stroke: #c9d1d9; }
      .wash   { fill: #c9d1d9; opacity: 0.16; }
      .sweep  { fill: #c9d1d9; }
    }
  </style>

  <g opacity="0">
