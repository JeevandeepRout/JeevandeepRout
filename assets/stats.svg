<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-label="GitHub statistics">
  <defs>
    <style>
      .h { font: 700 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #111; }
      .n { font: 700 31px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #111; }
      .s { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #666; }
      .bar { fill: #111; }
      .ghost { fill: #ddd; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="208" rx="18" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="30" y="34" class="h">GITHUB // DAILY SNAPSHOT</text>

  <g transform="translate(30 55)">
    <text x="0" y="0" class="s">REPOSITORIES</text>
    <text x="0" y="34" class="n">7</text>
  </g>
  <g transform="translate(190 55)">
    <text x="0" y="0" class="s">FOLLOWERS</text>
    <text x="0" y="34" class="n">3</text>
  </g>
  <g transform="translate(350 55)">
    <text x="0" y="0" class="s">STARS</text>
    <text x="0" y="34" class="n">0</text>
  </g>
  <g transform="translate(510 55)">
    <text x="0" y="0" class="s">CONTRIBUTIONS</text>
    <text x="0" y="34" class="n">0</text>
  </g>

  <text x="30" y="132" class="s">ACTIVITY PULSE</text>
  <g transform="translate(30 145)">
    <rect x="0" y="0" width="690" height="22" rx="11" class="ghost"/>
    <rect x="0" y="0" width="8%" height="22" rx="11" class="bar">
      <animate attributeName="width" values="0;8%;8%" dur="1.4s" fill="freeze"/>
    </rect>
  </g>
  <text x="30" y="190" class="s">STACK // JavaScript · C++</text>
</svg>