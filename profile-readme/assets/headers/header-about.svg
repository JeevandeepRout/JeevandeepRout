<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 64"
     width="760" height="64" role="img" aria-label="about section">
  <defs>
    <style>
      .bg    { fill: #0b0b0c; }
      .idx   { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 15px; fill: #4a4a47; }
      .title {
        font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-weight: 700; font-size: 30px;
        fill: #f2f2f0; letter-spacing: 3px;
      }
      .tag   { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 13px; fill: #8d8d88; }
      .bracket { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 30px; fill: #4a4a47; }
      .line  { stroke: #4a4a47; stroke-width: 1; }
      .cursor {
        fill: #c7c7c2;
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        0%, 49%   { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .grow {
        stroke-dasharray: 640;
        stroke-dashoffset: 640;
        animation: draw 1.6s ease-out forwards;
      }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="64"/>

  <text class="idx" x="0" y="16">01</text>
  <text class="bracket" x="0" y="46">&#8203;</text>
  <text class="title" x="0" y="46">
    <tspan fill="#4a4a47">&lt;</tspan>ABOUT<tspan fill="#4a4a47">/&gt;</tspan>
  </text>
  <rect class="cursor" x="173" y="24" width="10" height="24"/>

  <text class="tag" x="752" y="16" text-anchor="end">whoami</text>

  <line class="line grow" x1="0" y1="58" x2="760" y2="58"/>
</svg>