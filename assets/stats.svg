<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190"
     width="760" height="190" role="img" aria-label="live GitHub stats for JeevandeepRout">
  <defs>
    <style>
      .bg     { fill: #0b0b0c; }
      .lbl    { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 12px; fill: #8d8d88; }
      .val    { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 12px; fill: #f2f2f0; }
      .track  { fill: #4a4a47; opacity: 0.35; }
      .bar    {
        fill: #f2f2f0;
        transform-box: fill-box;
        transform-origin: left;
        transform: scaleX(0);
        animation: grow 1s ease-out forwards;
      }
      @keyframes grow { to { transform: scaleX(1); } }
      .spark {
        fill: none; stroke: #c7c7c2; stroke-width: 1.6;
        animation: draw 2.2s ease-out forwards;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .spark-dot {
        fill: #f2f2f0;
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { r: 3; opacity: 1; }
        50%      { r: 5; opacity: 0.5; }
      }
      .meta { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 11px; fill: #4a4a47; }
      .head { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 12px; fill: #8d8d88; letter-spacing: 1px; }
      .divider { stroke: #4a4a47; stroke-width: 1; opacity: 0.5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="190" rx="10"/>

  <g transform="translate(20, 26)">
    <text class="lbl" x="0" y="34">followers</text>
    <rect class="track" x="150" y="23" width="250" height="10" rx="2"/>
    <rect class="bar" x="150" y="23" width="125" height="10" rx="2"
          style="animation-delay:0.0s"/>
    <text class="val" x="412" y="34">3</text>
    <text class="lbl" x="0" y="58">repos</text>
    <rect class="track" x="150" y="47" width="250" height="10" rx="2"/>
    <rect class="bar" x="150" y="47" width="250" height="10" rx="2"
          style="animation-delay:0.1s"/>
    <text class="val" x="412" y="58">6</text>
    <text class="lbl" x="0" y="82">stars</text>
    <rect class="track" x="150" y="71" width="250" height="10" rx="2"/>
    <rect class="bar" x="150" y="71" width="2" height="10" rx="2"
          style="animation-delay:0.2s"/>
    <text class="val" x="412" y="82">0</text>
    <text class="lbl" x="0" y="106">forks</text>
    <rect class="track" x="150" y="95" width="250" height="10" rx="2"/>
    <rect class="bar" x="150" y="95" width="2" height="10" rx="2"
          style="animation-delay:0.3s"/>
    <text class="val" x="412" y="106">0</text></g>

  <line class="divider" x1="470" y1="14" x2="470" y2="176"/>

  <g transform="translate(490, 24)">
    <text class="head" x="0" y="0">CONTRIBUTIONS / 24 WEEKS</text>
    <g transform="translate(0, 16)">
    <path class="spark" d="M 0.0,40.0 L 10.9,40.0 L 21.7,40.0 L 32.6,40.0 L 43.5,40.0 L 54.3,40.0 L 65.2,40.0 L 76.1,40.0 L 87.0,40.0 L 97.8,40.0 L 108.7,40.0 L 119.6,40.0 L 130.4,40.0 L 141.3,40.0 L 152.2,40.0 L 163.0,40.0 L 173.9,6.9 L 184.8,40.0 L 195.7,40.0 L 206.5,40.0 L 217.4,40.0 L 228.3,40.0 L 239.1,38.6 L 250.0,0.0" style="stroke-dasharray:440;stroke-dashoffset:440;"/>
    <circle class="spark-dot" cx="250.0" cy="0.0" r="3"/></g>
    <text class="meta" x="0" y="78">total: 54</text>
    <text class="meta" x="0" y="96">JavaScript 4  C++ 1  Python 1</text>
  </g>

  <text class="meta" x="20" y="176">updated 2026-08-08 UTC &#183; refreshed daily via GitHub Actions</text>
</svg>